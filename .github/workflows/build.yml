name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify (Java 21, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Separate step so a wrapper/toolchain problem is distinguishable from a test failure.
      - name: Show toolchain
        run: |
          chmod +x mvnw
          java -version
          ./mvnw -B -ntp -v

      # Integration tests start their own PostgreSQL from embedded binaries (Zonky),
      # so no database service container or Gemini API key is required.
      - name: Build and run the full test suite
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production image
        run: docker build -t examprep:ci .
