services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examprep}
      POSTGRES_USER: ${POSTGRES_USER:-examprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examprep}
    volumes:
      - examprep-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examprep} -d ${POSTGRES_DB:-examprep}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      # Bound to localhost on 5433 so it never clashes with a Postgres already running on 5432.
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Linux Docker Engine resolves host.docker.internal only with this mapping, so the container
    # can reach a FreeLLMAPI router running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-examprep}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-examprep}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-examprep}
      # The same .env works locally and in Docker: localhost is the host for `spring-boot:run`, while
      # the container reaches the self-hosted router through host.docker.internal.
      FREELLMAPI_BASE_URL: ${FREELLMAPI_DOCKER_BASE_URL:-http://host.docker.internal:3001/v1}
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
      FREELLMAPI_MODEL: ${FREELLMAPI_MODEL:-auto}
      FREELLMAPI_CONNECT_TIMEOUT_SECONDS: ${FREELLMAPI_CONNECT_TIMEOUT_SECONDS:-10}
      FREELLMAPI_TIMEOUT_SECONDS: ${FREELLMAPI_TIMEOUT_SECONDS:-180}
      FREELLMAPI_TUTOR_TIMEOUT_SECONDS: ${FREELLMAPI_TUTOR_TIMEOUT_SECONDS:-60}
      FREELLMAPI_MAX_RETRIES: ${FREELLMAPI_MAX_RETRIES:-2}
      FREELLMAPI_MAX_CONCURRENCY: ${FREELLMAPI_MAX_CONCURRENCY:-3}
      FREELLMAPI_REASONING_EFFORT: ${FREELLMAPI_REASONING_EFFORT:-low}
      APP_STORAGE_LOCATION: /app/data/uploads
      APP_MAX_UPLOAD_SIZE_MB: ${APP_MAX_UPLOAD_SIZE_MB:-25}
      SERVER_PORT: 8080
    volumes:
      - examprep-uploads:/app/data/uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  examprep-db:
  examprep-uploads:
