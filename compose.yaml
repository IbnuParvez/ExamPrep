name: examprep

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examprep
      POSTGRES_USER: examprep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - examprep-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examprep -d examprep"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/examprep
      SPRING_DATASOURCE_USERNAME: examprep
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-120}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-8192}
      APP_MAX_UPLOAD_SIZE_MB: ${APP_MAX_UPLOAD_SIZE_MB:-25}
      APP_STALE_JOB_MINUTES: ${APP_STALE_JOB_MINUTES:-30}
      APP_STORAGE_LOCATION: /app/data/uploads
      SERVER_PORT: "8080"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - examprep-uploads:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped

volumes:
  examprep-db:
  examprep-uploads:
