<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Deliberately self-contained: this page must render even when the layout fragment or
         the page that failed could not be resolved. -->
    <title th:text="${status != null and status >= 400 and status < 600} ? 'Error ' + ${status} + ' — ExamPrep' : 'Something went wrong — ExamPrep'">Something went wrong — ExamPrep</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main id="main" class="page-frame">
    <div class="card" style="max-width:640px;margin:4rem auto;text-align:center;padding:2.5rem">
        <p class="eyebrow" th:text="${status != null and status >= 400 and status < 600} ? 'Error ' + ${status} : 'Error'">Error</p>
        <h1 th:text="${status != null and status == 404} ? 'We could not find that page'
                 : (${status != null and status == 403} ? 'You do not have access to that page'
                 : 'Something went wrong')">Something went wrong</h1>
        <p th:text="${message != null and !#strings.isEmpty(message)} ? ${message}
                 : (${status != null and status == 404} ? 'The page you asked for does not exist or has moved.'
                 : 'Please try again. If the problem continues, sign out and back in.')">
            Please try again.
        </p>
        <div class="button-row" style="justify-content:center;margin-top:1.5rem">
            <a class="button" th:href="@{/dashboard}">Back to dashboard</a>
            <a class="button button-secondary" th:href="@{/}">Home</a>
        </div>
    </div>
</main>
</body>
</html>
