<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Sign in')}"></head>
<body>
<header th:replace="~{layout/fragments :: publicHeader}"></header>

<main class="site-main">
    <div class="container auth-shell">
        <div class="auth-card">
            <h1>Sign in</h1>
            <p class="auth-card__intro">Return to your documents and study packages.</p>

            <div class="alert alert--error" th:if="${loginError}">
                The email address or password was not recognised. Please try again.
            </div>
            <div class="alert alert--success" th:if="${logout}">
                You have been signed out.
            </div>
            <div class="alert alert--success" th:if="${registered}">
                Your account has been created. Sign in to continue.
            </div>

            <form th:action="@{/login}" method="post" novalidate>
                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required autofocus
                           th:value="${registrationEmail}">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn--primary btn--block" type="submit">Sign in</button>
            </form>

            <p class="auth-card__footer">
                New to ExamPrep? <a th:href="@{/register}">Create an account</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
