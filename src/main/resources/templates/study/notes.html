<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Revision notes')}"></head>
<body>
<header th:replace="~{layout/fragments :: appHeader('study')}"></header>

<div class="app-frame app-frame--aside">
    <aside th:replace="~{layout/fragments :: studyAside}"></aside>

    <main class="app-main">
        <div class="page-head">
            <div>
                <span class="eyebrow">Revision</span>
                <h1 class="page-title">Detailed revision notes</h1>
                <p class="page-subtitle">The document rewritten for exam revision, keeping the original meaning
                    and pointing back to where each section came from.</p>
            </div>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(pack.revisionNotes)}">
            <h3>No revision notes were generated</h3>
            <p>Generate a new study package to try again.</p>
        </div>

        <div class="panel" th:unless="${#lists.isEmpty(pack.revisionNotes)}">
            <div class="panel__body">
                <section class="note-section" th:each="section : ${pack.revisionNotes}">
                    <h2 th:text="${section.heading}">Heading</h2>
                    <p class="note-narrative" th:text="${section.narrative}">Notes</p>
                    <div th:if="${!#lists.isEmpty(section.keyPoints)}">
                        <h3>Key points</h3>
                        <ul class="key-points">
                            <li th:each="point : ${section.keyPoints}" th:text="${point}">Point</li>
                        </ul>
                    </div>
                    <div th:if="${!#lists.isEmpty(section.sourceReferences)}">
                        <div class="row" style="gap: 0.35rem;">
                            <span class="panel__meta">Source:</span>
                            <span class="source-tag" th:each="reference : ${section.sourceReferences}"
                                  th:text="${reference.locationLabel}">Page 3</span>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
