<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Topics')}"></head>
<body>
<header th:replace="~{layout/fragments :: appHeader('study')}"></header>

<div class="app-frame app-frame--aside">
    <aside th:replace="~{layout/fragments :: studyAside}"></aside>

    <main class="app-main">
        <div class="page-head">
            <div>
                <span class="eyebrow">Structure</span>
                <h1 class="page-title">Topics and subtopics</h1>
                <p class="page-subtitle">The major ideas the document covers, with the concepts that matter for
                    each one.</p>
            </div>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(pack.topics)}">
            <h3>No topics were generated</h3>
            <p>Generate a new study package to try again.</p>
        </div>

        <article class="topic-card" th:each="topic, iter : ${pack.topics}">
            <span class="panel__meta" th:text="'Topic ' + ${iter.count}">Topic 1</span>
            <h2 th:text="${topic.title}">Topic</h2>
            <p th:text="${topic.explanation}">Explanation</p>
            <div th:if="${!#lists.isEmpty(topic.keyConcepts)}">
                <h3>Key concepts</h3>
                <ul class="concept-list">
                    <li th:each="concept : ${topic.keyConcepts}" th:text="${concept}">Concept</li>
                </ul>
            </div>
            <div th:if="${!#lists.isEmpty(topic.sourceReferences)}">
                <span class="panel__meta">Source</span>
                <div class="row" style="gap: 0.35rem;">
                    <span class="source-tag" th:each="reference : ${topic.sourceReferences}"
                          th:text="${reference.locationLabel}">Page 3</span>
                </div>
            </div>
        </article>
    </main>
</div>

<footer th:replace="~{layout/fragments :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
