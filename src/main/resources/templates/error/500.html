<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{layout/fragments :: publicHeader}"></header>
<main class="site-main">
    <div class="container">
        <div class="error-shell">
            <div class="error-code">500</div>
            <h1 th:text="${title} ?: 'Something went wrong'">Something went wrong</h1>
            <p th:text="${message} ?: 'The request could not be completed. The problem has been logged.'">
                The request could not be completed.</p>
            <div class="btn-row" style="justify-content: center;">
                <a class="btn btn--primary" th:href="@{/dashboard}">Go to dashboard</a>
                <a class="btn btn--secondary" th:href="@{/}">Back to the home page</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
