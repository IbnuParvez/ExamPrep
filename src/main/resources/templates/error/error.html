<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Something went wrong — ExamPrep</title>
</head>
<body>
<main>
    <div class="card" style="max-width:680px;margin:2rem auto;text-align:center;padding:2.5rem">
        <p class="eyebrow" th:text="${status != null ? 'Error ' + status : 'Error'}">Error</p>
        <h1 th:text="${status != null and status == 404 ? 'We could not find that page'
                     : (status != null and status == 403 ? 'You do not have access to that page'
                     : 'Something went wrong')}">Something went wrong</h1>
        <p th:text="${message != null ? message : 'The page you asked for is not available.'}">
            The page you asked for is not available.
        </p>
        <div class="button-row" style="justify-content:center;margin-top:1.5rem">
            <a class="button" th:href="@{/dashboard}">Back to dashboard</a>
            <a class="button button-secondary" th:href="@{/}">Home</a>
        </div>
    </div>
</main>
</body>
</html>
