spring:
  application:
    name: ExamPrep
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/examprep}
    username: ${SPRING_DATASOURCE_USERNAME:examprep}
    password: ${SPRING_DATASOURCE_PASSWORD:examprep}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE_MB:25}MB
      max-request-size: ${APP_MAX_REQUEST_SIZE_MB:30}MB
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  mvc:
    hiddenmethod:
      filter:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false

examprep:
  storage:
    # Must stay outside src/main/resources/static: uploaded files are never web-served.
    location: ${APP_STORAGE_LOCATION:./data/uploads}
    max-file-size-mb: ${APP_MAX_UPLOAD_SIZE_MB:25}
  ai:
    api-key: ${GOOGLE_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:240}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    temperature: 0.35
    max-output-tokens: 32768
    max-source-chars: 90000
    segment-char-limit: 18000
  processing:
    document-threads: 2
    study-threads: 2
    queue-capacity: 100
    stale-after-minutes: 60

logging:
  level:
    root: INFO
    com.examprep: INFO
    org.apache.tika: WARN
    org.apache.pdfbox: ERROR
    org.apache.poi: WARN
