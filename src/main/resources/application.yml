spring:
  application:
    name: ExamPrep
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/examprep}
    username: ${SPRING_DATASOURCE_USERNAME:examprep}
    password: ${SPRING_DATASOURCE_PASSWORD:examprep}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE_MB:25}MB
      max-request-size: ${APP_MAX_UPLOAD_SIZE_MB:25}MB
  thymeleaf:
    cache: true
  mvc:
    problemdetails:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 60m

app:
  storage:
    location: ${APP_STORAGE_LOCATION:./data/uploads}
  upload:
    max-size-mb: ${APP_MAX_UPLOAD_SIZE_MB:25}
  processing:
    stale-after-minutes: ${APP_STALE_JOB_MINUTES:30}
    max-extracted-characters: ${APP_MAX_EXTRACTED_CHARACTERS:1500000}
    max-chunk-characters: 2400
    target-chunk-characters: 1800
    minimum-meaningful-characters: 200
  study:
    max-source-characters-per-request: 24000
    section-batch-characters: 12000
    default-question-count: 15
    default-flashcard-count: 20
    default-exam-duration-minutes: 30
    max-question-count: 40
    max-flashcard-count: 60
  tutor:
    max-context-chunks: 6

ai:
  gemini:
    api-key: ${GOOGLE_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:120}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:8192}

logging:
  level:
    root: INFO
    com.examprep: INFO
    org.apache.pdfbox: WARN
    org.apache.tika: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
